[project]
name = "perler-svg-pattern"
version = "0.2.0"
description = "MCP server and CLI for converting images into validated Perler Beads SVG patterns."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "柯影数智团队" },
]
dependencies = [
    "pillow>=11.0,<13",
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.10,<5",
    "scikit-learn>=1.6,<2",
    "mcp[cli]>=2,<3",
]

[project.optional-dependencies]
color = [
    "scikit-image>=0.25,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false
