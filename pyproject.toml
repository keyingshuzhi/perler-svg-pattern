[project]
name = "perler-svg-pattern"
version = "0.1.0"
description = "Convert images into professional Perler Beads SVG patterns."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pillow>=11.0,<13",
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.10,<5",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
color = [
    "scikit-image>=0.25,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false
